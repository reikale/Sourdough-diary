
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sourdough Diary | My Floury Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@300..700&family=Indie+Flower&family=Bagel+Fat+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fffaf0;
            color: #4a4a4a;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 {
            font-family: 'Bagel Fat One', system-ui;
        }
        .handwriting {
            font-family: 'Indie Flower', cursive;
        }
        .blob {
            position: absolute;
            z-index: -1;
            filter: blur(60px);
            opacity: 0.4;
            pointer-events: none;
        }
        .sticker-card {
            border: 4px solid #000;
            box-shadow: 8px 8px 0px 0px #000;
            transition: all 0.2s ease;
        }
        .sticker-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 12px 12px 0px 0px #000;
        }
        .bg-pattern {
            background-image: radial-gradient(#fbbf24 1px, transparent 1px);
            background-size: 30px 30px;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-1deg); }
        }
        .floating {
            animation: float 5s ease-in-out infinite;
        }
        .wavy-text {
            text-decoration: underline wavy #facc15;
            text-underline-offset: 8px;
        }
        .curvy-bg {
            border-radius: 60% 40% 70% 30% / 30% 70% 30% 70%;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
  }
}
</script>
</head>
<body class="bg-pattern">
    <div id="root"></div>
</body>
</html>
